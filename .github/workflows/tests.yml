name: Automated Tests

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - ".agents/**"
      - ".vscode/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/pull_request_template.md"

jobs:
  changes:
    name: Detect Modified Scopes & TDD Mode
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      commit_message: ${{ steps.tdd.outputs.commit_message }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Detect TDD Commit Tag ([red], [green], [refactor])
        id: tdd
        env:
          TARGET_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          MSG=$(git log -1 --pretty=%s "$TARGET_SHA")
          echo "commit_message=$MSG" >> "$GITHUB_OUTPUT"
          echo "Detected commit subject: $MSG"

      - name: Check modified paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/tests.yml'
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/tests.yml'

  test-backend:
    name: Backend Tests (Express + PostgreSQL + TDD)
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_test_password
          POSTGRES_DB: mvp_menina_mulher_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      NODE_ENV: test
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres_test_password@localhost:5432/mvp_menina_mulher_test?schema=public

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install backend dependencies
        run: npm --prefix backend install

      - name: Generate Prisma Client & Apply Migrations
        run: |
          npm --prefix backend run prisma:generate
          npm --prefix backend run prisma:deploy

      - name: Run Backend Tests with TDD Gate
        working-directory: backend
        env:
          COMMIT_MESSAGE: ${{ needs.changes.outputs.commit_message }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          set +e
          npx vitest run --coverage --reporter=default --reporter=json --outputFile=vitest-report.json
          VITEST_EXIT=$?
          set -e
          npx tsx src/__tests__/setup/verify-tdd-ci.ts "$VITEST_EXIT"

  test-frontend:
    name: Frontend Tests (React + Vitest)
    needs: changes
    if: ${{ needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install frontend dependencies
        run: npm --prefix frontend install

      - name: Run Frontend Tests
        run: npm run test:frontend
